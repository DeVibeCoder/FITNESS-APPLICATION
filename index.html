<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Circuit" />
    <meta name="theme-color" content="#f3f2ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Track workouts, weight, steps and meals with your group. Show up, log it, keep the chain going."
    />
    <title>Circuit</title>
    <script>
      // Applied before first paint so the app never flashes the wrong theme.
      try {
        var pref = localStorage.getItem('circuit.theme')
        if (pref === 'dark' || pref === 'light') {
          document.documentElement.dataset.theme = pref
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
