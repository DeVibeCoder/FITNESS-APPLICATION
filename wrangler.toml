# Cloudflare configuration for the Circuit backend.
#
# Backend Phase 2: development resources only. The production D1 database and
# production R2 bucket are deliberately NOT declared here, because they do not
# exist yet and nothing should be able to reach them by accident.
#
# Pages requires every binding to sit under an environment. There are no
# top-level bindings on purpose: a binding written at the top level applies to
# every environment at once, which is exactly the mistake this file exists to
# make impossible.
#
# Secrets are never written here. See `.dev.vars.example` for local values and
# `wrangler pages secret put` for deployed ones.

name = "fitness-application"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

# --- Development / preview -----------------------------------------------
#
# `preview` is the environment every Pages deployment that is not the
# production branch runs in, and the one `wrangler pages dev` uses locally.

[env.preview.vars]
ENVIRONMENT = "development"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "circuit-dev"
database_id = "722c4aba-d51f-4040-af0e-752916df3f0d"


# Realtime delivery for the group chat.
#
# Pages can bind a Durable Object but cannot define one, so the class lives in
# the `circuit-chat-realtime` Worker (workers/chat-realtime) and is reached
# from here by `script_name`. That Worker has no route and no workers.dev
# subdomain, so this binding is the only way to it — and the Function behind
# the binding authenticates the session before forwarding anything.
#
# The object stores nothing. D1 is still the record; this only tells the other
# people in the conversation that it changed.
[[env.preview.durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"
script_name = "circuit-chat-realtime"

# Object storage for photos and clips. The bytes live here; D1 holds a key.
[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "rally-media-dev"

# --- Production -----------------------------------------------------------
#
# The live application.
#
# The database exists and is empty apart from reference data: the exercise
# catalogue and the achievement definitions, which are facts about the app
# rather than about any person. No account has ever been created in it.
#
# The deployed application does not use it yet — production still runs on
# Dexie in the browser, and the only server code it reaches is the Gemini and
# USDA analysis path. Binding it here is what lets the next phase deploy
# something that can.
#
# ENVIRONMENT is set so server code and tooling recognise production and
# refuse to seed it.

[env.production.vars]
ENVIRONMENT = "production"

# The real database. Deliberately a different name AND a different id from
# circuit-dev, so a copied command line cannot quietly point one environment
# at the other's data.
[[env.production.d1_databases]]
binding = "DB"
database_name = "circuit-prod"
database_id = "9247acf9-c2aa-449a-8244-cf9c8f67681c"

[[env.production.durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"
script_name = "circuit-chat-realtime"

# The real bucket. Named apart from the development one on purpose, so a
# copied command cannot write a test photograph into production.
[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "rally-media-prod"
